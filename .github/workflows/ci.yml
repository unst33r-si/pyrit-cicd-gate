name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

  gate-self-test:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Gate passes at 0.4% simulated ASR
        run: |
          pyrit-gate --engine mock \
            --mock-breach-rate 0.004 \
            --output-dir /tmp/gate-pass
          test $? -eq 0

      - name: Gate blocks at 1.8% simulated ASR
        run: |
          set +e
          pyrit-gate --engine mock \
            --mock-breach-rate 0.018 \
            --output-dir /tmp/gate-fail
          code=$?
          set -e
          echo "exit code: $code"
          test "$code" -eq 1

      - name: Gate is INVALID when the attacker refuses too often
        run: |
          set +e
          pyrit-gate --engine mock \
            --mock-breach-rate 0.0 \
            --mock-attacker-refusal-rate 0.10 \
            --output-dir /tmp/gate-invalid
          code=$?
          set -e
          echo "exit code: $code"
          test "$code" -eq 2

      - name: HTTP engine loopback against mock target
        run: |
          python3 examples/mock_target_server.py --port 8787 --breach-rate 0.0 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8787/v1/models > /dev/null && break || sleep 0.2
          done
          pyrit-gate --engine http \
            --unst33r-endpoint http://127.0.0.1:8787/v1 \
            --unst33r-api-key loopback-key \
            --target-endpoint http://127.0.0.1:8787/v1 \
            --target-api-key loopback-key \
            --target-model openai/mock-agent \
            --single-turn-count 60 --multi-turn-count 10 \
            --output-dir /tmp/gate-http
          code=$?
          kill $SERVER_PID || true
          test "$code" -eq 0
