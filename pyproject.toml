[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrit-cicd-gate"
version = "1.0.0"
description = "UNST33R PyRIT CI/CD Security Gate - adversarial red-team gate for AI applications on every pull request"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "UNST33R" }]
keywords = ["pyrit", "red-team", "security", "ci-cd", "llm", "jailbreak"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
# Core dependencies are deliberately light so the http and mock engines (and
# the unit-test suite) work in minimal environments.  The PyRIT engine needs
# the optional extra below (mirrors requirements.txt).
dependencies = [
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
pyrit = ["pyrit>=0.10.0,<0.12.0"]
all = ["pyrit>=0.10.0,<0.12.0", "pyyaml>=6.0.1", "httpx>=0.27.0"]

[project.scripts]
pyrit-gate = "pyrit_gate.cli:main"

[project.urls]
Homepage = "https://github.com/unst33r-si/pyrit-cicd-gate"
Repository = "https://github.com/unst33r-si/pyrit-cicd-gate"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["pyrit_gate"]
